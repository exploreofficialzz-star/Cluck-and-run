name: cluck_and_run
description: Cluck & Run — Endless runner where a chicken escapes a hungry farmer!
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^4.0.0
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4
  audioplayers: ^6.0.0
  app_tracking_transparency: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
