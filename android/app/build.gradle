plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ── Read signing config from key.properties ──────────────────────────────────
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

android {
    namespace        "com.chastech.cluckandrun"
    compileSdk       flutter.compileSdkVersion
    ndkVersion       flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    // ── Signing ──────────────────────────────────────────────────────────────
    signingConfigs {
        release {
            keyAlias        keystoreProperties['keyAlias']
            keyPassword     keystoreProperties['keyPassword']
            storeFile       keystoreProperties['storeFile'] ?
                            file(keystoreProperties['storeFile']) : null
            storePassword   keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId    "com.chastech.cluckandrun"
        minSdkVersion    21
        targetSdkVersion flutter.targetSdkVersion
        versionCode      flutterVersionCode.toInteger()
        versionName      flutterVersionName
        multiDexEnabled  true
    }

    buildTypes {
        release {
            signingConfig   signingConfigs.release
            minifyEnabled   true
            shrinkResources true
            proguardFiles   getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
}

flutter { source '../..' }

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
}
