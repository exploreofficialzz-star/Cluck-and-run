# .github/workflows/build_release.yml
# ─────────────────────────────────────────────────────────────────────────────
# Cluck & Run — CI/CD Pipeline
# Triggers: push to main, or manual dispatch
# Produces:  signed APK + AAB (Android)  •  unsigned IPA archive (iOS)
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*.*.*' ]          # e.g. v1.0.0 triggers a release
  workflow_dispatch:                 # manual trigger from GitHub UI

env:
  FLUTTER_VERSION: '3.22.0'
  JAVA_VERSION:    '17'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # ANDROID BUILD
  # ═══════════════════════════════════════════════════════════════════════════
  android:
    name: 🤖 Android — APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ── 3. Flutter ─────────────────────────────────────────────────────────
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel:         stable
          cache:           true

      # ── 4. Get packages ────────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 5. Decode & place keystore ─────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEY_JKS }}" | base64 --decode > android/app/cluckandrun_release.jks

      # ── 6. Create key.properties ───────────────────────────────────────────
      - name: Create key.properties
        run: |
          cat > android/key.properties << PROPS
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=cluckandrun_release.jks
          PROPS

      # ── 7. Run tests ───────────────────────────────────────────────────────
      - name: Flutter test
        run: flutter test --no-pub
        continue-on-error: true    # don't block on test failures during dev

      # ── 8. Build APK (direct install / sideload) ───────────────────────────
      - name: Build APK (release)
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      # ── 9. Build App Bundle (Play Store) ───────────────────────────────────
      - name: Build App Bundle (release)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      # ── 10. Upload APK artifact ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cluck-and-run-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── 11. Upload AAB artifact ────────────────────────────────────────────
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: cluck-and-run-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 12. Create GitHub Release (on version tag only) ────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Cluck & Run ${{ github.ref_name }}
          body: |
            ## 🐔 Cluck & Run ${{ github.ref_name }}
            
            **Artifacts:**
            - `app-release.apk` — Direct install (sideload)
            - `app-release.aab` — Google Play Store upload
            
            **App ID:** `com.chastech.cluckandrun`
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # iOS BUILD  (requires macOS runner — uses GitHub-hosted mac runner)
  # ═══════════════════════════════════════════════════════════════════════════
  ios:
    name: 🍎 iOS — IPA Archive
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel:         stable
          cache:           true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (no-codesign for CI)
        run: flutter build ios --release --no-codesign

      - name: Create IPA archive
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/cluck-and-run.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cluck-and-run-ios-ipa
          path: build/ios/ipa/cluck-and-run.ipa
          retention-days: 30
